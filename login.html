<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cine Club - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h2 class="logo">Cine Club</h2>
    <nav id="menu">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="login.html">Login</a></li>
        <li class="tem-submenu">
          <a href="sobre.html" id="btn-sobre">Sobre</a>
          <ul class="submenu" id="menu-vertical-sobre">
            <li><a href="sobre.html#empresa" id="link-empresa">Empresa</a></li>
            <li><a href="sobre.html#clientes" id="link-clientes">Clientes</a></li>
          </ul>
        </li>
        <li class="tem-submenu">
          <a href="contato.html" id="btn-contato">Contato</a>
          <ul class="submenu" id="menu-vertical-contato">
            <li><a href="contato.html#telefones" id="link-telefone">Telefones</a></li>
            <li><a href="mailto:contato@cineclub.com.br?subject=Contato%20pelo%20site%20Cine%20Club" id="link-email">Email</a></li>
          </ul>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Entrar no Cine Club</h1>
    <p>Acesse sua conta para avaliar filmes e participar da comunidade.</p>

    <form id="form-login">
      <label for="email-login">Email</label>
      <input type="email" id="email-login" name="email" required>

      <label for="senha-login">Senha</label>
      <input type="password" id="senha-login" name="senha" required>

      <button type="submit" class="botao" id="btn-entrar">Entrar</button>
      <p id="msg-login" class="mensagem"></p>
    </form>

    <p>Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </main>

  <footer>
    <p id="data-atual"></p>
    <p>Todos os direitos reservados. Desenvolvido por: Isabella e Arthur</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
